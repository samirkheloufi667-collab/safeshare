server {
  listen 80;
  root /usr/share/nginx/html;

  # Application monopage : toute adresse inconnue renvoie index.html,
  # c'est React Router qui affiche la bonne page.
  location / {
    try_files $uri /index.html;
  }

  # Fichiers générés avec une empreinte dans leur nom : cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  add_header X-Content-Type-Options nosniff;
  # Les liens de partage portent leur jeton dans l'adresse : jamais transmis à un autre site.
  add_header Referrer-Policy no-referrer;
}
