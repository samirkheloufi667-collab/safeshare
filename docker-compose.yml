# Environnement complet : PostgreSQL, API Express et interface React.
#   docker compose up --build
#   docker compose exec -e NODE_ENV=development api npx tsx prisma/seed.ts   (données de démo)
# Interface -> http://localhost:8080   API -> http://localhost:4200/api
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safeshare
      POSTGRES_PASSWORD: safeshare
      POSTGRES_DB: safeshare
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeshare"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://safeshare:safeshare@postgres:5432/safeshare
      JWT_SECRET: change-me
      WEB_ORIGIN: http://localhost:8080
    ports: ["4200:4200"]
    volumes: [storage:/data/storage]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { VITE_API_URL: "http://localhost:4200/api" }
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  storage:
